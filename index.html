<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoLite | Acesso Rápido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #1e293b; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 5px; background: #0f172a; color: #fff; font-size: 16px; }
        .input-group input:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; padding: 10px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-entrar { background: #38bdf8; color: #0f172a; }
        .btn-entrar:hover { background: #0ea5e9; }
        .btn-criar { background: #10b981; color: #fff; margin-top: 5px; }
        .btn-criar:hover { background: #059669; }
        #mensagem { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>NexoLite</h2>
        <form id="auth-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Seu e-mail" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" id="btn-criar" class="btn-criar">Criar Nova Conta</button>
        </form>
        <p id="mensagem"></p>
    </div>

    <!-- Importação do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const supabaseUrl = 'https://nwpkmaubbnqqfqodbule.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cGttYXViYm5xcWZxb2RidWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzE1NTgsImV4cCI6MjA1Njc5MTU1OH0.sua_chave_aqui';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const mensagem = document.getElementById('mensagem');

        // Lógica de Entrar (Login)
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            mensagem.innerText = "Conectando...";
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value
            });

            if (error) {
                mensagem.innerText = "Erro: " + error.message;
            } else {
                mensagem.innerText = "✅ Login feito com sucesso!";
            }
        });

        // Lógica de Criar Conta
        document.getElementById('btn-criar').addEventListener('click', async () => {
            if (!emailInput.value || !passwordInput.value) {
                mensagem.innerText = "Preencha o e-mail e a senha para criar conta.";
                return;
            }
            mensagem.innerText = "Criando conta...";
            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value
            });

            if (error) {
                mensagem.innerText = "Erro: " + error.message;
            } else {
                mensagem.innerText = "✅ Conta criada com sucesso! Verifique seu e-mail se necessário.";
            }
        });
    </script>
</body>
</html>
