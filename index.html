<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>NexoLite - Teste</title>
</head>
<body style="background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;">
<div style="background:#1e293b; padding:30px; border-radius:10px; width:300px;">
<h2>Teste de Rede</h2>
<button id="btn" style="width:100%; padding:10px; background:#38bdf8; color:#0f172a; border:none; font-weight:bold;">Testar Internet</button>
<p id="m" style="margin-top:10px; font-size:14px;"></p>
</div>

<script>
document.getElementById('btn').onclick = async () => {
  const m = document.getElementById('m');
  m.innerText = "A testar...";
  try {
    const resposta = await fetch('https://jsonplaceholder.typicode.com/todos/1');
    const dados = await resposta.json();
    m.innerText = "✅ Sucesso de rede! Resposta: " + dados.title;
  } catch (err) {
    m.innerText = "❌ Bloqueado: " + err.message;
  }
};
</script>
</body>
</html>
