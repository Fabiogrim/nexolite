<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoLite | Acesso Rápido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 380px; }
        h2 { text-align: center; margin-bottom: 2rem; color: #38bdf8; font-weight: 700; }
        .input-group { margin-bottom: 1.25rem; }
        input { width: 100%; padding: 0.85rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 0.85rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .btn-entrar { background: #38bdf8; color: #0f172a; margin-top: 0.5rem; }
        .btn-criar { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; margin-top: 10px; }
        #mensagem { color: #38bdf8; text-align: center; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>NexoLite</h2>
        <form id="auth-form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Seu e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Sua senha (min 6 letras)" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" id="btn-criar" class="btn-criar">Criar Nova Conta</button>
        </form>
        <p id="mensagem"></p>
    </div>

    <!-- Script que conecta com o banco de dados Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // COLOQUE SUAS CHAVES AQUI MANTENDO AS ASPAS
        const supabaseUrl = 'https://nwpkmaubbnqqfqodbule.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cGttYXViYm5xZ2Zxb2RidWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5ODY2NjQsImV4cCI6MjEwNjU2MjY2NH0.xUuIZPllE8TczzLtpBEaRtdfFZnqg38Sk8Xs170HkH8';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        ;

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const msg = document.getElementById('mensagem');

        // Lógica de Entrar
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.innerText = "Conectando...";
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value
            });
            if (error) msg.innerText = "Erro: " + error.message;
            else msg.innerText = "✅ Login feito com sucesso!";
        });

        // Lógica de Criar Conta
        document.getElementById('btn-criar').addEventListener('click', async () => {
            if(!emailInput.value || !passwordInput.value) {
                msg.innerText = "Preencha e-mail e senha para criar conta."; return;
            }
            msg.innerText = "Criando conta...";
            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value
            });
            if (error) msg.innerText = "Erro: " + error.message;
            else msg.innerText = "📩 Conta criada! Olhe seu e-mail para confirmar.";
        });
    </script>
</body>
</html>
